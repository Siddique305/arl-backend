<h2 mat-dialog-title>Logout Confirmation</h2>
<mat-dialog-content class="mat-typography">
    Are you sure you want to logout?
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button matButton [mat-dialog-close]="false">Stay Logged In</button>
    <button matButton [mat-dialog-close]="true" cdkFocusInitial>Logout</button>
</mat-dialog-actions>
