<div class="bg-dark d-flex justify-content-center align-items-center vh-100 bg-light">

  <form class="bg-white p-4 rounded shadow" style="width: 400px; max-width: 90vw;">
    <h3 class="mb-4">Login to Your Account</h3>
    <!-- Email input -->
    <div class="form-outline mb-4">
      <input type="email" id="form2Example1" class="form-control" name="email"  [(ngModel)]="email" required/>
      <label class="form-label" for="form2Example1">
        Email address
      </label>
    </div>

    <!-- Password input -->
    <div class="form-outline mb-4">
      <input type="password" id="form2Example2" class="form-control" name="password" [(ngModel)]="password" required/>
      <label class="form-label" for="form2Example2">
        Password
      </label>
    </div>

    <!-- Remember + Forgot -->
    <div class="row mb-4">
      <div class="col d-flex justify-content-center">
        <div class="form-check">
          <input class="form-check-input"
                 type="checkbox"
                 id="form2Example31"
                 checked />

          <label class="form-check-label" for="form2Example31">
            Remember me
          </label>
        </div>
      </div>

      <div class="col text-end">
        <a href="#!">Forgot password?</a>
      </div>
    </div>

    <!-- Submit button -->
    <button type="button" [disabled]="email=='' || password=='' "
            class="btn btn-primary w-100 mb-4" (click)="signIn()">
      Sign in
    </button>

    <!-- Register -->
    <div class="text-center">
      <p>
        Not a member?
        <a href="#!">Sign Up</a>
      </p>

      <p>or sign up with:</p>

      <button type="button"
              class="btn btn-link btn-floating mx-1">
        <i class="fab fa-facebook-f"></i>
      </button>

      <button type="button"
              class="btn btn-link btn-floating mx-1">
        <i class="fab fa-google"></i>
      </button>

      <button type="button"
              class="btn btn-link btn-floating mx-1">
        <i class="fab fa-twitter"></i>
      </button>

      <button type="button"
              class="btn btn-link btn-floating mx-1">
        <i class="fab fa-github"></i>
      </button>
    </div>

  </form>

</div>
